{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="result-card">
        <div class="result-header">
            <h2>🩸 Edit CBC Results</h2>
            <p class="text-muted mb-0">Order ID: #{{ result.order_id }} | {{ result.patient_id }} - {{ result.name }} | {{ result.order_date.strftime('%Y-%m-%d') }}</p>
        </div>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-3"><label>WBC</label><input type="number" step="0.01" name="wbc" value="{{ result.wbc }}" class="form-control" required></div>
                <div class="col-md-3"><label>RBC</label><input type="number" step="0.01" name="rbc" value="{{ result.rbc }}" class="form-control" required></div>
                <div class="col-md-3"><label>Hemoglobin (g/dL)</label><input type="number" step="0.01" name="hemoglobin" value="{{ result.hemoglobin }}" class="form-control" required></div>
                <div class="col-md-3"><label>Hematocrit (%)</label><input type="number" step="0.01" name="hematocrit" value="{{ result.hematocrit }}" class="form-control" required></div>
                <div class="col-md-3"><label>Platelets</label><input type="number" name="platelets" value="{{ result.platelets }}" class="form-control" required></div>
                <div class="col-md-3"><label>MCV</label><input type="number" name="mcv" value="{{ result.mcv }}" class="form-control" required></div>
                <div class="col-md-3"><label>MCH</label><input type="number" name="mch" value="{{ result.mch }}" class="form-control" required></div>
                <div class="col-md-3"><label>Neutrophils (%)</label><input type="number" step="0.01" name="neutrophils" value="{{ result.neutrophils }}" class="form-control" required></div>
                <div class="col-md-3"><label>Lymphocytes (%)</label><input type="number" step="0.01" name="lymphocytes" value="{{ result.lymphocytes }}" class="form-control" required></div>
                <div class="col-md-3"><label>Monocytes (%)</label><input type="number" step="0.01" name="monocytes" value="{{ result.monocytes }}" class="form-control" required></div>
                <div class="col-md-3"><label>Eosinophils (%)</label><input type="number" step="0.01" name="eosinophils" value="{{ result.eosinophils }}" class="form-control" required></div>
                <div class="col-md-3"><label>Basophils (%)</label><input type="number" step="0.01" name="basophils" value="{{ result.basophils }}" class="form-control" required></div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-warning btn-lg">Update Results</button>
                <a href="/cbc-records" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
