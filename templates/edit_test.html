{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="result-card">
        <h2 class="text-center mb-4">Edit Test Catalog</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Test Name</label>
                    <input type="text" name="test_name" value="{{ test.test_name }}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Price</label>
                    <input type="number" step="0.01" name="price" value="{{ test.price }}" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <input type="text" name="description" value="{{ test.description }}" class="form-control">
                </div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-warning btn-lg">Update Test</button>
                <a href="/tests" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
